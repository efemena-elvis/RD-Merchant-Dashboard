image: node:16

stages:
  - install
  - build
  - deploy

# Job for installing dependencies
install:
  stage: install
  script:
    - npm install --legacy-peer-deps
  only:
    - staging
    - main

# Job for building on staging environment
build_staging:
  stage: build
  script:
    - npm ci --legacy-peer-deps
    # - npm install env-cmd --legacy-peer-deps
    - npm run build:staging
  artifacts:
    paths:
      - dist/
  only:
    - staging
  needs:
    - install

# Job for building on production environment
build_production:
  stage: build
  script:
    - npm ci --legacy-peer-deps
    # - npm install env-cmd --legacy-peer-deps
    - npm run build:prod
  artifacts:
    paths:
      - dist/
  only:
    - main
  needs:
    - install

# Job for deploying to staging
deploy_staging:
  image:
    name: amazon/aws-cli:latest
    entrypoint: 
      - '/usr/bin/env'
  stage: deploy
  script:
    - echo "Deploying to Staging Environment"
    - echo "Bucket Name: $STAGING_S3_BUCKET"
    - aws s3 sync dist/ s3://$STAGING_S3_BUCKET/ --acl public-read --delete
    - aws cloudfront create-invalidation --distribution-id $STAGING_CLOUDFRONT_DISTRIBUTION --paths "/*"
  environment:
    name: staging
  only:
    - staging
  needs:
    - build_staging

# Job for deploying to production
deploy_production:
  image:
    name: amazon/aws-cli:latest
    entrypoint: 
      - '/usr/bin/env'
  stage: deploy
  script:
    - echo "Deploying to Production Environment"
    - aws s3 sync dist/ s3://$MAIN_S3_BUCKET/ --acl public-read --delete
    - aws cloudfront create-invalidation --distribution-id $MAIN_CLOUDFRONT_DISTRIBUTION --paths "/*"
  environment:
    name: production
  only:
    - main
  needs:
    - build_production

before_script:
  # Configure AWS CLI with environment variables
  - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
  - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
  - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
