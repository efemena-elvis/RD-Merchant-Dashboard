stages:
  - build
  - deploy

# Job for building and testing
build:
  stage: build
  script:
    - npm install --legacy-peer-deps
  artifacts:
    paths:
      - dist/
  only:
    - staging
    - main

# Job for deploying to staging
deploy_staging:
  stage: deploy
  script:
    - echo "Deploying to Staging Environment"
    - aws s3 sync dist/ s3://$STAGING_S3_BUCKET/ --acl public-read --delete
    - aws cloudfront create-invalidation --distribution-id $STAGING_CLOUDFRONT_DISTRIBUTION --paths "/*"
  environment:
    name: staging
  only:
    - staging

# Job for deploying to production
deploy_production:
  stage: deploy
  script:
    - echo "Deploying to Production Environment"
    - aws s3 sync dist/ s3://$MAIN_S3_BUCKET/ --acl public-read --delete
    - aws cloudfront create-invalidation --distribution-id $MAIN_CLOUDFRONT_DISTRIBUTION --paths "/*"
  environment:
    name: main
  only:
    - main

before_script:
  # Configure AWS CLI with environment variables
  - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
  - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
  - export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION